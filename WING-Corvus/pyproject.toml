[project]
name = "ctf-agent"
version = "0.1.0"
description = "CTF-Agent 全能型自动化攻防智能体系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ctf-agent" }]
# 宿主导包依赖: 模块级 import 必需 (缺失会导致 import ctf_agent 崩溃)
# 容器脚本依赖 (angr/fpylll/pwntools/z3/pycryptodome/pillow 等) 由执行层镜像预装,
# 宿主本地开发时可用 [project.optional-dependencies].tools 安装。
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rich>=13.7",
    "paramiko>=3.4",   # ssh/client.py 模块级 import (SSH 连接)
    "numpy>=1.26",     # tools/audio_stego_sweep.py 模块级 import
    "scipy>=1.12",     # tools/audio_stego_sweep.py 模块级 import
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pyflakes>=3.2",
]
# S9: SDK 后端 (DOCKER_BACKEND=sdk) 依赖 docker-py; cli 后端无需安装
docker = [
    "docker>=7.0",
]
# 容器脚本依赖 (执行层镜像已预装; 宿主本地跑容器内脚本复现/调试时安装)
tools = [
    "pycryptodome>=3.20",  # 容器脚本 Crypto.AES (des/ecdsa 脚本)
    "pillow>=10.0",        # 容器脚本 PIL (OCR/图片处理)
    "z3-solver>=4.12",     # 容器脚本 from z3 import * (des_tool)
    "angr>=9.2",           # 容器脚本 angr/claripy (angr_tool)
    "claripy>=9.2",
    "fpylll>=0.6.0",       # 容器脚本 fpylll (sage_tool 格攻击)
    "pwntools>=4.12",      # 容器脚本 from pwn import * (exploit_template)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ctf_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
